[project]
name = "assistente-encosta"
version = "0.1.0"
description = "Assistente Encosta: LLM local com RAG para orientação sobre risco de deslizamento (FIAP GS 2026.2)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
